<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#000000" />
  <title>Январь.редактор</title>
  <link rel="icon" href="build/icon.png" />
  <link rel="stylesheet" href="styles.css" />

<body>
  <div id="app">
    <div id="main">
      <aside id="sidebar">
        <div id="tree-head">
          <div class="app-brand">Январь.редактор</div>
          <div class="family-seg" id="family-seg" role="radiogroup" aria-label="Тип прошивки">
            <button type="button" role="radio" data-family="trs" aria-checked="true">TRS</button>
            <button type="button" role="radio" data-family="ls" aria-checked="false">LS</button>
            <button type="button" role="radio" data-family="stock" aria-checked="false">Сток</button>
          </div>
          <div class="search-wrap">
            <input id="search" type="search" placeholder="Поиск: имя, 0x607D" autocomplete="off" spellcheck="false" />
            <span id="search-count"></span>
          </div>
          <button type="button" class="file-menu-btn" id="file-menu-btn" aria-label="Файл" aria-haspopup="true" aria-expanded="false"></button>
          <input class="file-pick" id="file-bin" type="file" accept=".bin,.BIN" />
          <input class="file-pick" id="file-map" type="file" accept=".j5,.J5,.j7,.J7" />
          <input class="file-pick" id="file-compare" type="file" accept=".bin,.BIN" />
          <button type="button" class="compare-chip" id="compare-chip" hidden></button>
          <div class="file-menu" id="file-menu" hidden>
            <label class="file-menu-item" id="open-bin-item" for="file-bin">Открыть прошивку</label>
            <label class="file-menu-item off" id="open-map-item" for="file-map">Открыть карту</label>
            <label class="file-menu-item off" id="open-compare-item" for="file-compare">Сравнить с…</label>
            <button type="button" class="file-menu-item" id="clear-compare" hidden>Снять сравнение</button>
            <button type="button" class="file-menu-item" id="download-bin" disabled>Сохранить прошивку…</button>
            <button type="button" class="file-menu-item" id="ai-export-btn" disabled>Экспорт для ИИ…</button>
            <button type="button" class="file-menu-item danger" id="revert-bin" disabled>Откатить всё</button>
          </div>
        </div>
        <nav id="tree"></nav>
      </aside>
      <section id="detail">
        <div class="open-hint" id="open-hint">
          <p class="open-hint-step">1</p>
          <h2>Открой прошивку</h2>
          <p class="hint">Слайдер <b>TRS / LS / Сток</b> сверху. Для TRS карта подхватится сама.</p>
          <button type="button" class="open-hint-go" id="hint-open-bin">Открыть прошивку</button>
        </div>
      </section>
    </div>
    <div id="status">нет файлов</div>
  </div>
